[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dental_ai"
version = "0.1.0"
description = "치과 AI 공용 라이브러리 (PyTorch dataloader · loss · network)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",  # loss 파일마다 들어 있는 시각화 코드, dental_ai preprocess-view
    "numpy",
    "scipy",       # Hungarian matching(linear_sum_assignment), cKDTree
    # CUDA 빌드는 PyPI에 없다 (Windows PyPI 휠은 CPU 전용). 먼저 아래처럼 깔아 두면
    # 이 요구 조건을 이미 만족하므로 pip이 CPU 빌드로 바꿔치기하지 않는다.
    #   pip install torch --index-url https://download.pytorch.org/whl/cu128
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]
# python -m dental_ai.dataset.ToothSegLoader (augmentation 디버그 창).  화면 없는 서버는
# opencv-python-headless를 깔고 --save로 png를 쓴다.
debug = ["opencv-python"]

[tool.setuptools.packages.find]
# 소스는 dental_ai/src/dental_ai/ 에 둔다 (src 레이아웃).
#   dental_ai.dataset  — PyTorch Dataset / DataLoader
#   dental_ai.loss     — loss 함수
#   dental_ai.network  — 핵심 network
where = ["dental_ai/src"]
# "dental_ai"만 적으면 하위 패키지(dental_ai.dataset, dental_ai.loss, dental_ai.network)가
# 전부 빠진 채로 빌드된다 — find는 이 include 패턴에 정확히 일치하는 이름만 남긴다.
include = ["dental_ai*"]
# 네임스페이스 패키지가 아님을 명시 (각 디렉터리에 __init__.py 필요)
namespaces = false

# 터미널 명령 'dental_ai <명령> [인자]' (dental_ai/__main__.py):  pip install -e . --no-deps
[project.scripts]
dental_ai = "dental_ai.__main__:main"
